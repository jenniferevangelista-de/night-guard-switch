name: end-to-end on a real Switch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      writer:
        description: "template (fixed texts) or ollama (Gemma writes the explanation and the talk script)"
        default: template
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NG_WRITER: ${{ inputs.writer || 'template' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Gemma through Ollama (only when the writer is ollama)
        if: ${{ inputs.writer == 'ollama' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for _ in $(seq 30); do curl -sf localhost:11434/api/version >/dev/null && break; sleep 1; done
          ollama pull ${NG_WRITER_MODEL:-gemma3:4b} >/dev/null
          echo "Gemma ready"
      - name: Switch v0.31.0 + family room + scripted parents
        run: scripts/demo.sh
      - name: Logs on failure
        if: failure()
        run: |
          cat out/helper.log || true
          cd switch && docker compose -f deploy/local/standalone-docker-compose.yml --project-directory . --profile collab --profile gateway logs --tail 150 switch setup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript
          path: out/

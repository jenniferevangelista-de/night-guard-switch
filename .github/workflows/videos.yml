name: record the demo videos
# Two videos in the Night Guard format, made in the cloud:
#  1. record (Linux): a real run of Switch v0.31.0 + Mattermost + both agents (Gemma writing), filmed with Playwright.
#  2. render (Windows): the film (paper style, Snoozy) and the tour (that recording in the paper frame), with the
#     same Windows fonts the Night Guard films used. Both MP4s are uploaded as the "videos" artifact.
on:
  workflow_dispatch:
    inputs:
      writer:
        description: "template or ollama (Gemma)"
        default: ollama
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NG_WRITER: ${{ inputs.writer || 'ollama' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Gemma through Ollama (only when the writer is ollama)
        if: ${{ (inputs.writer || 'ollama') == 'ollama' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for _ in $(seq 30); do curl -sf localhost:11434/api/version >/dev/null && break; sleep 1; done
          ollama pull ${NG_WRITER_MODEL:-gemma3:4b} >/dev/null
          echo "Gemma ready"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Tour narration (sets how long each part lasts)
        run: python video/tour_script.py
      - name: Switch v0.31.0 + family + agents
        run: |
          scripts/switch-up.sh
          pip install -q -e .
          SWITCH_ENV=switch/.env python -m family_room.setup
          mkdir -p out
          python -m family_room.helper > out/helper.log 2>&1 &
          sleep 4
      - name: Record
        run: python video/record_demo.py
      - name: Logs on failure
        if: failure()
        run: cat out/helper.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: recording
          path: |
            video/work/raw/
            video/work/voice/
            video/work/scenes.json
            video/work/voice.json
            video/work/tour_narration.json

  render:
    needs: record
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: recording
          path: video/work
      - name: Tools
        run: |
          choco install ffmpeg -y --no-progress >/dev/null
          pip install -q edge-tts pillow numpy soundfile httpx
          for f in segoeprb.ttf impact.ttf segoeui.ttf segoeuib.ttf segoeuii.ttf seguisym.ttf seguiemj.ttf; do
            [ -f "/c/Windows/Fonts/$f" ] && echo "font ok: $f" || echo "font missing: $f"
          done
      - name: Open fonts for anything Windows lacks
        run: |
          mkdir -p video/ng/fonts && cd video/ng/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sfLo Kalam-Bold.ttf $base/kalam/Kalam-Bold.ttf || true
          curl -sfLo Anton-Regular.ttf $base/anton/Anton-Regular.ttf || true
      - name: Film
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          python video/film_script.py
          python video/film_audio.py
          RENDER_PROCS=4 python video/film_render.py
      - name: Tour
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          python video/tour_build.py
      - name: Review frames
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          mkdir -p video/out/frames
          for t in 8 40 100 130 150 170; do ffmpeg -v error -y -ss $t -i video/out/night_guard_family_room_film.mp4 -frames:v 1 video/out/frames/film_$t.jpg || true; done
          for t in 5 30 55 75 95; do ffmpeg -v error -y -ss $t -i video/out/night_guard_family_room_tour.mp4 -frames:v 1 video/out/frames/tour_$t.jpg || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: video/out/

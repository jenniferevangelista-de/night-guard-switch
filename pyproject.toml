[project]
name = "night-guard-switch"
version = "0.1.0"
description = "Night Guard alerts worked out by the family and an AI agent in their group chat, through Switch"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["nightguard", "video/ng", "video/film.py", "video/film_audio.py", "video/film_render.py", "video/tour_build.py"]  # pre-existing Night Guard code, kept as it was

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.setuptools]
packages = ["family_room", "nightguard"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
